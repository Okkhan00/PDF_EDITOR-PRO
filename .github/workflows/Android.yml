
name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Also publish the APK as a GitHub Release"
        type: boolean
        default: false

      build_signed_release:
        description: "Also build a signed release APK (needs ANDROID_KEYSTORE_* secrets)"
        type: boolean
        default: false

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PdfEdit Pro APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --------------------------------------------------
      # 3. Java
      # --------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # --------------------------------------------------
      # 4. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 5. Install Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 6. Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------
      # 7. npm dependencies
      # --------------------------------------------------
      - name: Install npm dependencies
        run: npm ci

      # --------------------------------------------------
      # 8. Build Web App
      # --------------------------------------------------
      - name: Build web assets
        run: npm run build

      # --------------------------------------------------
      # 9. Capacitor Sync
      # --------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android

      # --------------------------------------------------
      # 10. Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # --------------------------------------------------
      # 11. Upload Debug APK Artifact
      # --------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ==================================================
      # OPTIONAL SIGNED RELEASE
      # ==================================================

      - name: Decode Android Keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release && env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build Signed Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release && env.HAS_KEYSTORE == 'true' }}
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Signed Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release && env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-Pro-Android-APK-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ==================================================
      # GITHUB RELEASE
      # ==================================================

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-build${{ github.run_number }}
          name: PdfEdit Pro Android v1.3.0 (Build ${{ github.run_number }})
          generate_release_notes: true

          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

          fail_on_unmatched_files: false

      # ==================================================
      # SHOW DIRECT LINKS
      # ==================================================

      - name: Show Latest Release Links
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
        run: |
          echo ""
          echo "=============================================="
          echo "       PdfEdit Pro - Latest Release"
          echo "=============================================="
          echo ""
          echo "Latest Release Page:"
          echo "https://github.com/${{ github.repository }}/releases/latest"
          echo ""
          echo "Direct Debug APK:"
          echo "https://github.com/${{ github.repository }}/releases/download/v1.3.0-build${{ github.run_number }}/app-debug.apk"
          echo ""
          echo "Direct Release APK:"
          echo "https://github.com/${{ github.repository }}/releases/download/v1.3.0-build${{ github.run_number }}/app-release.apk"
          echo ""
          echo "=============================================="

