name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Also publish the APK as a GitHub Release"
        type: boolean
        default: false
      build_signed_release:
        description: "Also build a signed release APK (needs the ANDROID_KEYSTORE_* secrets)"
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: write   # only used when create_release is ticked

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21 (required by Capacitor 7 / AGP 8.7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets (copies libraries, fonts and OCR data into www/vendor)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---------- Optional: signed release APK (skipped unless requested + secrets exist) ----------
      - name: Decode keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release && env.HAS_KEYSTORE == 'true' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release && env.HAS_KEYSTORE == 'true' }}
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release && env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-Pro-Android-APK-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ---------- Optional: GitHub Release ----------
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-build${{ github.run_number }}
          name: PdfEdit Pro Android v1.3.0 (build ${{ github.run_number }})
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: false
