name: Android APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      create_release:
        description: "Also publish the APK as a GitHub Release"
        type: boolean
        default: true
      build_signed_release:
        description: "Also build a signed release APK (needs ANDROID_KEYSTORE_* secrets)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PdfEdit Pro APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify installed SDK
        run: |
          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo "ADB:"
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode Android Keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release && env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build Signed Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release && env.HAS_KEYSTORE == 'true' }}
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Signed Release APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release && env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-Pro-Android-APK-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Automatic release:
      # - Every push to main creates a new GitHub Release.
      # - Manual workflow can disable release creation.
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-build${{ github.run_number }}
          name: PdfEdit Pro Android v1.3.0 - Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

      - name: Upload Signed APK to GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.build_signed_release && env.HAS_KEYSTORE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-build${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      - name: Show Release Links
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        run: |
          echo ""
          echo "=============================================="
          echo "       PDFEDIT PRO ANDROID RELEASE"
          echo "=============================================="
          echo ""
          echo "Latest Release:"
          echo "https://github.com/${{ github.repository }}/releases/latest"
          echo ""
          echo "Latest APK Direct Download:"
          echo "https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          echo ""
          echo "This URL automatically points to the newest GitHub Release APK."
          echo ""
          echo "Current Release:"
          echo "https://github.com/${{ github.repository }}/releases/tag/v1.3.0-build${{ github.run_number }}"
          echo ""
          echo "=============================================="
